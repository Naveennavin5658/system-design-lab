<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1200" y1="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F7FF"/>
      <stop offset="1" stop-color="#EEF9FF"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#6D5DF6"/>
      <stop offset="1" stop-color="#2BB8A7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D">GM Tracker Backend Architecture</text>
  <text x="600" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#58657F">Derived from the current repo structure: gm-tracker-ui + gm-tracker-api</text>

  <g filter="url(#shadow)">
    <rect x="70" y="140" width="220" height="120" rx="20" fill="#FFFFFF" stroke="#E9ECF5"/>
    <text x="180" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#14213D">React UI</text>
    <text x="180" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#58657F">Vite app • login • forms • dashboard</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="140" width="220" height="120" rx="20" fill="#FFFFFF" stroke="#E9ECF5"/>
    <text x="470" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#14213D">FastAPI App</text>
    <text x="470" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#58657F">src/main.py</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="140" width="220" height="120" rx="20" fill="#FFFFFF" stroke="#E9ECF5"/>
    <text x="760" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#14213D">Routers</text>
    <text x="760" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#58657F">auth • habits • goals • finance</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="140" width="220" height="120" rx="20" fill="#FFFFFF" stroke="#E9ECF5"/>
    <text x="1050" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#14213D">Schemas</text>
    <text x="1050" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#58657F">Pydantic validation</text>
  </g>

  <path d="M290 200H360" stroke="url(#primary)" stroke-width="5" stroke-linecap="round"/>
  <path d="M580 200H650" stroke="url(#primary)" stroke-width="5" stroke-linecap="round"/>
  <path d="M870 200H940" stroke="url(#primary)" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="175" y="360" width="260" height="150" rx="22" fill="#FFFFFF" stroke="#E9ECF5"/>
    <text x="305" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#14213D">Domain Modules</text>
    <text x="305" y="432" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#58657F">auth.py</text>
    <text x="305" y="454" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#58657F">habits.py / goals.py / finance.py</text>
    <text x="305" y="476" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#58657F">dashboard.py</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="360" width="260" height="150" rx="22" fill="#FFFFFF" stroke="#E9ECF5"/>
    <text x="600" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#14213D">Data Layer</text>
    <text x="600" y="432" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#58657F">in-memory dicts</text>
    <text x="600" y="454" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#58657F">local dev objects</text>
    <text x="600" y="476" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#58657F">ready for DB later</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="765" y="360" width="260" height="150" rx="22" fill="#FFFFFF" stroke="#E9ECF5"/>
    <text x="895" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#14213D">API Contracts</text>
    <text x="895" y="432" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#58657F">POST /auth/register</text>
    <text x="895" y="454" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#58657F">GET /transactions</text>
    <text x="895" y="476" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#58657F">GET /dashboard/today</text>
  </g>

  <path d="M305 260V335H465V360" stroke="url(#primary)" stroke-width="5" stroke-linecap="round"/>
  <path d="M600 260V335H600V360" stroke="url(#primary)" stroke-width="5" stroke-linecap="round"/>
  <path d="M895 260V335H730V360" stroke="url(#primary)" stroke-width="5" stroke-linecap="round"/>

  <g>
    <rect x="140" y="575" width="920" height="80" rx="20" fill="#14213D" opacity="0.96"/>
    <text x="180" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#F8FAFC">Flow:</text>
    <text x="250" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#E2E8F0">React UI → FastAPI routers → Pydantic schemas → in-memory domain store → JSON responses</text>
  </g>
</svg>
